<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hedgehog & Apples</title>
<style>
  body {
    margin: 0;
    background: #87ceeb;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    overflow: hidden;
  }
  #game {
    border: 4px solid #5a3a1a;
    border-radius: 4px;
    image-rendering: pixelated;
    box-shadow: 8px 8px 0 rgba(0,0,0,0.3);
  }
  #info {
    position: absolute;
    top: 15px;
    left: 20px;
    font-size: 20px;
    font-weight: bold;
    color: #5a3a1a;
    text-shadow: 2px 2px 0 #fff;
  }
  #combo {
    position: absolute;
    top: 15px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: bold;
    color: #dc2626;
    text-shadow: 2px 2px 0 #fff;
    opacity: 0;
    transition: opacity 0.3s;
  }
  #hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    color: #5a3a1a;
    opacity: 0.7;
  }
</style>
</head>
<body>
<canvas id="game" width="800" height="600"></canvas>
<div id="info">🍎 <span id="score">0</span> &nbsp; ❤️ <span id="lives">3</span> &nbsp; 🏆 <span id="best">0</span></div>
<div id="combo"></div>
<div id="hint">← → / A D move &nbsp;·&nbsp; P pause &nbsp;·&nbsp; M mute &nbsp;·&nbsp; R restart</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;
ctx.imageSmoothingEnabled = false;

const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const bestEl = document.getElementById('best');
const comboEl = document.getElementById('combo');

const GROUND_Y = H - 80;

// --- Persistence ---
let best = parseInt(localStorage.getItem('hedgehogBest') || '0');
bestEl.textContent = best;

// --- Sound ---
let audioCtx = null;
let muted = false;
function beep(freq, dur = 0.08, type = 'square', vol = 0.06) {
  if (muted) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.value = freq;
    g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(); o.stop(audioCtx.currentTime + dur);
  } catch(e) {}
}

// --- Entities ---
const hedgehog = {
  x: W / 2 - 30, y: GROUND_Y - 40,
  w: 60, h: 40, speed: 6,
  dir: 1, animFrame: 0, animTimer: 0,
  invuln: 0, shield: 0
};

const keys = {};
document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if ([' ', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) e.preventDefault();
  if (e.key === 'p' || e.key === 'P') paused = !paused;
  if (e.key === 'm' || e.key === 'M') muted = !muted;
  if (gameOver && (e.key === 'r' || e.key === 'R')) restart();
});
document.addEventListener('keyup', e => keys[e.key] = false);

let apples = [];
let rocks = [];
let bees = [];
let powerups = [];
let particles = [];
let floaters = [];
let clouds = [];
let stars = [];

let score = 0, lives = 3, gameTime = 0;
let gameOver = false, paused = false;
let appleTimer = 0, rockTimer = 0, beeTimer = 0, powerupTimer = 0;
let combo = 0, comboTimer = 0;
let shake = 0;
let dayNight = 1;

let shieldTimer = 0, magnetTimer = 0, slowTimer = 0;

for (let i = 0; i < 5; i++) {
  clouds.push({ x: Math.random()*W, y: 40 + Math.random()*120, speed: 0.2 + Math.random()*0.3, size: 30 + Math.random()*30 });
}
for (let i = 0; i < 60; i++) {
  stars.push({ x: Math.random()*W, y: Math.random()*GROUND_Y, size: Math.random() < 0.7 ? 2 : 3, phase: Math.random()*Math.PI*2 });
}

// --- Drawing ---
function drawHedgehog(x, y, dir, walkFrame, shield) {
  ctx.save();
  ctx.translate(x + 30, y + 20);
  ctx.scale(dir, 1);
  ctx.translate(-30, -20);

  ctx.fillStyle = 'rgba(0,0,0,0.2)';
  ctx.beginPath(); ctx.ellipse(30, 42, 26, 5, 0, 0, Math.PI*2); ctx.fill();

  if (shield > 0) {
    ctx.strokeStyle = `rgba(96,165,250,${0.5 + Math.sin(gameTime*0.2)*0.3})`;
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(30, 22, 38, 0, Math.PI*2); ctx.stroke();
  }

  ctx.fillStyle = '#5a3a1a';
  ctx.beginPath(); ctx.ellipse(30, 22, 28, 18, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#3d2610';
  for (let i = 0; i < 8; i++) {
    const angle = Math.PI + (i/7)*Math.PI;
    const px = 30 + Math.cos(angle)*26;
    const py = 22 + Math.sin(angle)*20;
    ctx.beginPath();
    ctx.moveTo(px-3, py); ctx.lineTo(px+3, py); ctx.lineTo(px, py-8);
    ctx.closePath(); ctx.fill();
  }

  ctx.fillStyle = '#c9a06a';
  ctx.beginPath(); ctx.ellipse(52, 24, 12, 10, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#2a1a08'; ctx.fillRect(60, 22, 4, 4);
  ctx.fillStyle = '#2a1a08'; ctx.fillRect(50, 18, 3, 3);
  ctx.fillStyle = '#fff'; ctx.fillRect(51, 18, 1, 1);

  ctx.fillStyle = '#8a6a42';
  const legOffset = walkFrame ? 2 : 0;
  ctx.fillRect(18 + legOffset, 36, 6, 6);
  ctx.fillRect(38 - legOffset, 36, 6, 6);
  ctx.restore();
}

function drawApple(x, y, size, golden) {
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x + size/2, y + size + 2, size/2, 3, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = golden ? '#fbbf24' : '#dc2626';
  ctx.beginPath(); ctx.arc(x + size/2, y + size/2 + 2, size/2, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = golden ? '#fde68a' : '#f87171';
  ctx.beginPath(); ctx.arc(x + size/2 - 4, y + size/2 - 2, size/6, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#16a34a';
  ctx.beginPath(); ctx.ellipse(x + size/2 + 2, y - 2, 5, 3, -0.5, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = '#5a3a1a'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(x + size/2, y + 2); ctx.lineTo(x + size/2, y - 3); ctx.stroke();
}

function drawRock(x, y, size) {
  ctx.fillStyle = 'rgba(0,0,0,0.15)';
  ctx.beginPath(); ctx.ellipse(x + size/2, y + size - 2, size/2, 3, 0, 0, Math.PI*2); ctx.fill();

  ctx.fillStyle = '#6b7280';
  ctx.beginPath();
  ctx.moveTo(x+4, y+size); ctx.lineTo(x, y+size/2); ctx.lineTo(x+size/3, y);
  ctx.lineTo(x+size*2/3, y+4); ctx.lineTo(x+size, y+size/2); ctx.lineTo(x+size-4, y+size);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#4b5563';
  ctx.beginPath();
  ctx.moveTo(x+size*2/3, y+4); ctx.lineTo(x+size, y+size/2);
  ctx.lineTo(x+size-4, y+size); ctx.lineTo(x+size/2, y+size);
  ctx.closePath(); ctx.fill();

  ctx.fillStyle = '#9ca3af'; ctx.fillRect(x+size/4, y+size/3, 3, 3);
}

function drawBee(x, y, size, t) {
  const wingOffset = Math.sin(t * 0.5) * 3;
  ctx.fillStyle = 'rgba(255,255,255,0.8)';
  ctx.beginPath(); ctx.ellipse(x + size/2 - 6, y + size/2 - 4 + wingOffset, 6, 4, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + size/2 + 6, y + size/2 - 4 + wingOffset, 6, 4, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#facc15';
  ctx.beginPath(); ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1f2937';
  ctx.fillRect(x + size/2 - 6, y + size/2 - size/2 + 2, 3, size - 4);
  ctx.fillRect(x + size/2 + 3, y + size/2 - size/2 + 2, 3, size - 4);
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x + size/2 - 4, y + size/2 - 4, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + size/2 + 4, y + size/2 - 4, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(x + size/2 - 4, y + size/2 - 4, 1.2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + size/2 + 4, y + size/2 - 4, 1.2, 0, Math.PI*2); ctx.fill();
}

function drawPowerup(p) {
  const bob = Math.sin(gameTime * 0.1) * 3;
  ctx.save();
  ctx.translate(p.x + 14, p.y + 14 + bob);
  ctx.shadowBlur = 15;
  ctx.shadowColor = p.color;
  ctx.fillStyle = p.color;
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI*2); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 16px Courier New';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(p.symbol, 0, 1);
  ctx.textAlign = 'left';
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

function drawTree(x, y) {
  ctx.fillStyle = '#5a3a1a';
  ctx.fillRect(x - 8, y, 16, 80);
  ctx.fillStyle = '#16a34a';
  ctx.beginPath(); ctx.arc(x, y - 10, 40, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#15803d';
  ctx.beginPath(); ctx.arc(x - 20, y, 28, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 20, y, 28, 0, Math.PI*2); ctx.fill();
}

// --- Spawns ---
function spawnApple() {
  const size = 24;
  const golden = Math.random() < 0.08;
  apples.push({
    x: 40 + Math.random() * (W - 80 - size),
    y: -size, w: size, h: size,
    speed: 2 + Math.random() * 2 + gameTime / 3000,
    golden
  });
}
function spawnRock() {
  const size = 28 + Math.random() * 12;
  rocks.push({
    x: 40 + Math.random() * (W - 80 - size),
    y: -size, w: size, h: size,
    speed: 3 + Math.random() * 2 + gameTime / 3000
  });
}
function spawnBee() {
  const size = 28;
  const fromLeft = Math.random() < 0.5;
  const baseY = 100 + Math.random() * 200;
  bees.push({
    x: fromLeft ? -size : W, y: baseY,
    w: size, h: size,
    vx: (fromLeft ? 1 : -1) * (1.5 + Math.random()),
    baseY, phase: Math.random() * Math.PI * 2
  });
}
function spawnPowerup(x, y) {
  const types = [
    { type: 'shield', symbol: '🛡', color: '#3b82f6' },
    { type: 'magnet', symbol: '🧲', color: '#a855f7' },
    { type: 'slow',   symbol: '🐌', color: '#10b981' },
    { type: 'life',   symbol: '❤', color: '#ef4444' }
  ];
  const t = types[Math.floor(Math.random() * types.length)];
  powerups.push({ x, y, w: 28, h: 28, speed: 1.8, ...t });
}

function createParticles(x, y, color, count = 8) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 5,
      vy: -Math.random() * 4 - 1,
      life: 40, maxLife: 40,
      color, size: 3 + Math.random() * 3
    });
  }
}
function addFloater(x, y, text, color) {
  floaters.push({ x, y, text, color, life: 50, maxLife: 50, vy: -1.2 });
}

// --- Update ---
function update() {
  if (gameOver || paused) return;
  gameTime++;
  dayNight = (Math.sin(gameTime / 900) + 1) / 2;

  let moving = false;
  if (keys['ArrowLeft'] || keys['a'] || keys['A']) { hedgehog.x -= hedgehog.speed; hedgehog.dir = -1; moving = true; }
  if (keys['ArrowRight'] || keys['d'] || keys['D']) { hedgehog.x += hedgehog.speed; hedgehog.dir = 1; moving = true; }
  if (moving) {
    hedgehog.animTimer++;
    if (hedgehog.animTimer > 8) { hedgehog.animFrame ^= 1; hedgehog.animTimer = 0; }
  } else hedgehog.animFrame = 0;

  if (hedgehog.x < 10) hedgehog.x = 10;
  if (hedgehog.x > W - hedgehog.w - 10) hedgehog.x = W - hedgehog.w - 10;
  if (hedgehog.invuln > 0) hedgehog.invuln--;

  if (shieldTimer > 0) shieldTimer--;
  if (magnetTimer > 0) magnetTimer--;
  if (slowTimer > 0) slowTimer--;
  hedgehog.shield = shieldTimer;

  if (comboTimer > 0) {
    comboTimer--;
    if (comboTimer === 0 && combo > 1) {
      combo = 0;
      comboEl.style.opacity = 0;
    }
  }

  clouds.forEach(c => { c.x += c.speed; if (c.x > W + 80) c.x = -80; });

  const diff = Math.min(3, gameTime / 1800);
  const slowFactor = slowTimer > 0 ? 0.4 : 1;

  appleTimer++;
  if (appleTimer > Math.max(25, 60 - gameTime / 120)) { spawnApple(); appleTimer = 0; }

  rockTimer++;
  if (rockTimer > Math.max(50, 110 - gameTime / 120 - diff * 15)) { spawnRock(); rockTimer = 0; }

  if (gameTime > 600) {
    beeTimer++;
    if (beeTimer > Math.max(80, 200 - gameTime / 80 - diff * 20)) { spawnBee(); beeTimer = 0; }
  }

  powerupTimer++;
  if (powerupTimer > 500 && Math.random() < 0.01) { spawnPowerup(60 + Math.random()*(W-120), -30); powerupTimer = 0; }

  // Apples
  for (let i = apples.length - 1; i >= 0; i--) {
    const a = apples[i];
    a.y += a.speed * slowFactor;

    if (magnetTimer > 0) {
      const dx = (hedgehog.x + hedgehog.w/2) - (a.x + a.w/2);
      const dy = (hedgehog.y + hedgehog.h/2) - (a.y + a.h/2);
      const d = Math.hypot(dx, dy);
      if (d < 220 && d > 1) {
        a.x += dx / d * 4;
        a.y += dy / d * 4;
      }
    }

    if (a.y + a.h > hedgehog.y + 5 && a.y < hedgehog.y + hedgehog.h &&
        a.x + a.w > hedgehog.x && a.x < hedgehog.x + hedgehog.w) {
      combo++;
      comboTimer = 120;
      const multiplier = Math.min(combo, 10);
      const points = (a.golden ? 50 : 10) * multiplier;
      score += points;
      scoreEl.textContent = score;
      createParticles(a.x + a.w/2, a.y + a.h/2, a.golden ? '#fbbf24' : '#dc2626', a.golden ? 16 : 10);
      createParticles(a.x + a.w/2, a.y + a.h/2, '#16a34a', 4);
      addFloater(a.x + a.w/2, a.y, '+' + points, a.golden ? '#fbbf24' : '#fff');
      if (combo > 1) {
        comboEl.textContent = `COMBO x${multiplier}`;
        comboEl.style.opacity = 1;
      }
      beep(a.golden ? 1200 : 880, 0.06, 'square');
      apples.splice(i, 1);
      continue;
    }

    if (a.y > GROUND_Y - a.h + 10) {
      createParticles(a.x + a.w/2, GROUND_Y, '#dc2626', 5);
      combo = 0; comboEl.style.opacity = 0;
      apples.splice(i, 1);
    }
  }

  // Rocks
  for (let i = rocks.length - 1; i >= 0; i--) {
    const r = rocks[i];
    r.y += r.speed * slowFactor;

    const hit = r.y + r.h > hedgehog.y + 5 && r.y < hedgehog.y + hedgehog.h &&
                r.x + r.w > hedgehog.x + 5 && r.x < hedgehog.x + hedgehog.w - 5;

    if (hit && shieldTimer > 0) {
      createParticles(r.x + r.w/2, r.y + r.h/2, '#3b82f6', 12);
      beep(600, 0.1, 'triangle');
      rocks.splice(i, 1);
      continue;
    }
    if (hit && hedgehog.invuln <= 0) {
      lives--;
      livesEl.textContent = lives;
      hedgehog.invuln = 90;
      shake = 12;
      createParticles(r.x + r.w/2, r.y + r.h/2, '#6b7280', 14);
      beep(150, 0.2, 'sawtooth');
      rocks.splice(i, 1);
      if (lives <= 0) endGame();
      continue;
    }
    if (r.y > GROUND_Y - r.h + 10) {
      createParticles(r.x + r.w/2, GROUND_Y, '#6b7280', 5);
      rocks.splice(i, 1);
    }
  }

  // Bees
  for (let i = bees.length - 1; i >= 0; i--) {
    const b = bees[i];
    b.x += b.vx * slowFactor;
    b.phase += 0.08;
    b.y = b.baseY + Math.sin(b.phase) * 30;

    const hit = b.x + b.w > hedgehog.x + 5 && b.x < hedgehog.x + hedgehog.w - 5 &&
                b.y + b.h > hedgehog.y + 5 && b.y < hedgehog.y + hedgehog.h;

    if (hit && shieldTimer > 0) {
      createParticles(b.x + b.w/2, b.y + b.h/2, '#3b82f6', 12);
      beep(600, 0.1, 'triangle');
      bees.splice(i, 1);
      continue;
    }
    if (hit && hedgehog.invuln <= 0) {
      lives--;
      livesEl.textContent = lives;
      hedgehog.invuln = 90;
      shake = 12;
      createParticles(b.x + b.w/2, b.y + b.h/2, '#facc15', 12);
      beep(150, 0.2, 'sawtooth');
      bees.splice(i, 1);
      if (lives <= 0) endGame();
      continue;
    }
    if (b.x < -60 || b.x > W + 60) bees.splice(i, 1);
  }

  // Powerups
  for (let i = powerups.length - 1; i >= 0; i--) {
    const p = powerups[i];
    p.y += p.speed * slowFactor;

    if (p.y > H) { powerups.splice(i, 1); continue; }

    if (p.y + p.h > hedgehog.y && p.y < hedgehog.y + hedgehog.h &&
        p.x + p.w > hedgehog.x && p.x < hedgehog.x + hedgehog.w) {
      if (p.type === 'shield') shieldTimer = 480;
      if (p.type === 'magnet') magnetTimer = 420;
      if (p.type === 'slow') slowTimer = 300;
      if (p.type === 'life') { lives++; livesEl.textContent = lives; }
      createParticles(p.x + 14, p.y + 14, p.color, 12);
      addFloater(p.x + 14, p.y, p.type.toUpperCase(), p.color);
      beep(1000, 0.12, 'sine');
      powerups.splice(i, 1);
    }
  }

  // Particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life--;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Floaters
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.y += f.vy; f.life--;
    if (f.life <= 0) floaters.splice(i, 1);
  }

  if (shake > 0) shake -= 0.7;
}

function endGame() {
  gameOver = true;
  if (score > best) {
    best = score;
    localStorage.setItem('hedgehogBest', best);
    bestEl.textContent = best;
  }
}

function restart() {
  apples = []; rocks = []; bees = []; powerups = []; particles = []; floaters = [];
  score = 0; lives = 3; gameTime = 0;
  gameOver = false; paused = false;
  appleTimer = 0; rockTimer = 0; beeTimer = 0; powerupTimer = 0;
  combo = 0; comboTimer = 0; shake = 0;
  shieldTimer = 0; magnetTimer = 0; slowTimer = 0;
  hedgehog.x = W / 2 - 30;
  hedgehog.invuln = 0;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  comboEl.style.opacity = 0;
}

// --- Draw ---
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);

  const night = 1 - dayNight;
  const topR = Math.round(135 * dayNight + 20 * night);
  const topG = Math.round(206 * dayNight + 30 * night);
  const topB = Math.round(235 * dayNight + 70 * night);
  const botR = Math.round(224 * dayNight + 60 * night);
  const botG = Math.round(242 * dayNight + 70 * night);
  const botB = Math.round(254 * dayNight + 110 * night);
  const grad = ctx.createLinearGradient(0, 0, 0, GROUND_Y);
  grad.addColorStop(0, `rgb(${topR},${topG},${topB})`);
  grad.addColorStop(1, `rgb(${botR},${botG},${botB})`);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, GROUND_Y);

  const starAlpha = Math.max(0, 1 - dayNight * 1.6);
  if (starAlpha > 0) {
    stars.forEach(s => {
      const tw = 0.5 + Math.sin(gameTime * 0.05 + s.phase) * 0.5;
      ctx.globalAlpha = starAlpha * tw;
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    });
    ctx.globalAlpha = 1;
  }

  const sunX = W - 100, sunY = 80;
  if (dayNight > 0.4) {
    ctx.fillStyle = '#fde047';
    ctx.beginPath(); ctx.arc(sunX, sunY, 40, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#facc15';
    ctx.beginPath(); ctx.arc(sunX, sunY, 32, 0, Math.PI*2); ctx.fill();
  } else {
    ctx.fillStyle = '#e5e7eb';
    ctx.beginPath(); ctx.arc(sunX, sunY, 36, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#d1d5db';
    ctx.beginPath(); ctx.arc(sunX + 10, sunY - 8, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sunX - 12, sunY + 6, 6, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(sunX + 4, sunY + 12, 5, 0, Math.PI*2); ctx.fill();
  }

  clouds.forEach(c => {
    ctx.fillStyle = 'rgba(255,255,255,0.9)';
    ctx.beginPath();
    ctx.arc(c.x, c.y, c.size, 0, Math.PI*2);
    ctx.arc(c.x + c.size, c.y + 5, c.size * 0.8, 0, Math.PI*2);
    ctx.arc(c.x - c.size, c.y + 5, c.size * 0.7, 0, Math.PI*2);
    ctx.fill();
  });

  drawTree(100, GROUND_Y - 60);
  drawTree(W - 150, GROUND_Y - 40);

  ctx.fillStyle = '#7cb342';
  ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#558b2f';
  ctx.fillRect(0, GROUND_Y, W, 8);

  ctx.strokeStyle = '#558b2f';
  ctx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    const x = (i * 37) % W;
    const y = GROUND_Y + 10 + (i * 13) % 50;
    ctx.beginPath();
    ctx.moveTo(x, y); ctx.lineTo(x - 2, y - 6);
    ctx.moveTo(x, y); ctx.lineTo(x + 3, y - 5);
    ctx.stroke();
  }

  apples.forEach(a => drawApple(a.x, a.y, a.w, a.golden));
  rocks.forEach(r => drawRock(r.x, r.y, r.w));
  bees.forEach(b => drawBee(b.x, b.y, b.w, gameTime));
  powerups.forEach(p => drawPowerup(p));

  if (hedgehog.invuln <= 0 || Math.floor(gameTime / 5) % 2 === 0) {
    drawHedgehog(hedgehog.x, hedgehog.y, hedgehog.dir, hedgehog.animFrame, shieldTimer);
  }

  particles.forEach(p => {
    ctx.globalAlpha = p.life / p.maxLife;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  ctx.globalAlpha = 1;

  floaters.forEach(f => {
    ctx.globalAlpha = f.life / f.maxLife;
    ctx.fillStyle = f.color;
    ctx.font = 'bold 18px Courier New';
    ctx.textAlign = 'center';
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 3;
    ctx.strokeText(f.text, f.x, f.y);
    ctx.fillText(f.text, f.x, f.y);
    ctx.textAlign = 'left';
  });
  ctx.globalAlpha = 1;

  const hud = [];
  if (shieldTimer > 0) hud.push({ icon: '🛡', t: shieldTimer, c: '#3b82f6', max: 480 });
  if (magnetTimer > 0) hud.push({ icon: '🧲', t: magnetTimer, c: '#a855f7', max: 420 });
  if (slowTimer > 0)   hud.push({ icon: '🐌', t: slowTimer,   c: '#10b981', max: 300 });
  hud.forEach((h, i) => {
    const y = 80 + i * 34;
    ctx.fillStyle = 'rgba(0,0,0,0.4)';
    ctx.fillRect(20, y, 110, 26);
    ctx.fillStyle = h.c;
    ctx.fillRect(20, y, 110 * (h.t / h.max), 26);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px Courier New';
    ctx.fillText(`${h.icon} ${Math.ceil(h.t / 60)}s`, 30, y + 18);
  });

  if (paused && !gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 48px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('PAUSED', W / 2, H / 2);
    ctx.font = '22px Courier New';
    ctx.fillText('press P to resume', W / 2, H / 2 + 40);
    ctx.textAlign = 'left';
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(90, 58, 26, 0.85)';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 56px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', W / 2, H / 2 - 60);
    ctx.font = '26px Courier New';
    ctx.fillText('Apples: ' + Math.floor(score / 10), W / 2, H / 2 - 10);
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 25);
    ctx.fillStyle = '#fbbf24';
    ctx.fillText('Best: ' + best, W / 2, H / 2 + 60);
    ctx.fillStyle = '#fff';
    ctx.font = '20px Courier New';
    ctx.fillText('Press R to play again', W / 2, H / 2 + 110);
    ctx.textAlign = 'left';    ctx.textAlign = 'left';
  }

  ctx.restore();
}

// --- Main loop ---
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

loop();
</script>
</body>
