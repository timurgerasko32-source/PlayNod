<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>PlayNod</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#16a34a;color:#052e16;min-height:100vh}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.top{background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 0;position:sticky;top:0;z-index:50}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{font-weight:900;font-size:20px;color:#16a34a}
.search input{padding:8px 12px;border:1px solid #e5e7eb;border-radius:8px;width:200px;outline:none;font-family:inherit}
.head{padding:40px 0 20px;text-align:center}
.head h1{font-size:32px;color:#fff;margin-bottom:8px}
.head p{display:inline-block;background:#fff;color:#16a34a;padding:5px 14px;border-radius:999px;font-weight:700;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;padding-bottom:60px}
.card{background:#fff;border-radius:16px;overflow:hidden;cursor:pointer;transition:.2s}
.card:hover{transform:translateY(-4px);box-shadow:0 16px 32px -8px rgba(0,0,0,.25)}
.cover{aspect-ratio:16/10;background:#dcfce7;display:grid;place-items:center;overflow:hidden}
.cover svg{width:100%;height:100%;display:block}
.body{padding:18px}
.title{font-size:16px;font-weight:800;margin-bottom:8px}
.desc{color:#6b7280;font-size:13px;margin-bottom:14px}
.bottom{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid #f3f4f6}
.free{background:#dcfce7;color:#16a34a;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:800}
.play{padding:8px 16px;background:#16a34a;color:#fff;border:none;border-radius:8px;font-weight:800;font-size:13px;cursor:pointer}
.play:hover{background:#15803d}
.foot{background:#14532d;padding:20px 0;text-align:center;color:#bbf7d0;font-size:13px}
</style>
</head>
